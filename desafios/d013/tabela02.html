<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de tabelas parte 2</title>
</head>
<style>
    table {
        width: 300px;
        height: 50px;
        border-collapse: collapse;
    }

    td {
        border: 2px solid black;
        padding: 10px;
        text-align: center;
    }

</style>
<body>
    <h1>Desafio de tabela: parte 2</h1>
        <table>
            <tbody>
                <tr>
                    <td colspan="4">A</td>
                    <td rowspan="4">B</td>
                </tr>
                <tr>
                    <td rowspan="4"">C</td>
                    <td>D</td>
                    <td>E</td>
                    <TD>F</TD>
                </tr>
                <tr>
                    <td>G</td>
                    <td>H</td>
                    <td>I</td>
                </tr>
                <tr>
                    <td>J</td>
                    <td>L</td>
                    <td>M</td>
                </tr>
                <tr>
                    <td colspan="4">N</td>
                </tr>
            </tbody>
        </table>
</body>
</html>
