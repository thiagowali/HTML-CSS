<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="estilos/login.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <main>
        <section></section>
        <h1>Login</h1>
        <article>
            <p>
                Seja Bem-Vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
            </p>
        </article>
        <form action="post">
            <p>
                <label for="iemail"><span id="login" class="material-icons">person</span></label>
                <input type="email" name="iemail" id="email">
            </p>
            
            <p>
                <label for="isenha"><span id="login" class="material-icons">vpn_key</span></label>
                <input type="password" name="isenha" id="senha">
            </p>
            
            <p>
                <input type="submit" value="Entrar" id="entrar">
            </p>

            <p>
                <input type="submit" value="Esqueci a senha" id="esqueci">
            </p>
        </form>
    </main>  
</body>
</html>
