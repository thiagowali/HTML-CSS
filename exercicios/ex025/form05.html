<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de Formulários</h1>    
        <form action="" method="get" autocomplete="on">
            <fieldset>
                <legend>Sexo (forma errada)</legend>
                <input type="radio" name="fem" id="ifem"> <label for="ifem">Feminino</label> <br>
                <input type="radio" name="mas" id="imas" checked> <label for="imas">Masculino</label> <br>
            </fieldset>
            <fieldset>
                <legend>Sexo (forma Correta)</legend>
                <input type="radio" name="sexo" id="xfem" checked> <label for="xfem">Feminino</label> <br>
                <input type="radio" name="sexo" id="xmas"> <label for="xmas">Masculino</label> <br>
            </fieldset>
            <fieldset>
                <legend>Esportes Fvoritos</legend>
                <input type="checkbox" name="nat" id="inat"> <label for="inat">Natação</label> <br>
                <input type="checkbox" name="vol" id="ivol"> <label for="ivol">Volêi</label> <br>
                <input type="checkbox" name="bas" id="ibas"> Basquete <br>
                <input type="checkbox" name="ten" id="iten"> Tênis <br>
            </fieldset>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
</body>
</html>
