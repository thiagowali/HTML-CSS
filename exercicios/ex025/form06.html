<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>    
        <form action="cadastro.php" method="get">
            <p>
                <label for="icor">Cor:</label>
                <input type="color" name="cor" id="icor" value="#ffffff">
            </p>

            <p>
                <label for="inivel">Nível de Satisfação</label>
                <input type="range" name="nivel" id="inivel"  min="1" max="5" value="2">
            </p>

            <p>
                <label for="ifoto">foto do perfil</label>
                <input type="file" name="name" id="iname">
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
</body>
</html>
