<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        div.items {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="items">A</div>
        <div class="items">conteúdo</div> 
        <div class="items">C</div>
        <div class="items">conteúdo maior</div>
        <div class="items">E</div>
        <div class="items">F</div>
        <div class="items">contéudo maior ainda</div>
    </div>    
</body>
</html>
