<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap-reverse;
        }

        div.items {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="items">Exemplo de bloc: A</div>
        <div class="items">Exemplo de bloc: B</div>
        <div class="items">Exemplo de bloc: C</div>
        <div class="items">Exemplo de bloc: D</div>
        <div class="items">Exemplo de bloc: E</div>
        <div class="items">Exemplo de bloc: F</div>
        <div class="items">Exemplo de bloc: G</div>
    </div>    
</body>
</html>
