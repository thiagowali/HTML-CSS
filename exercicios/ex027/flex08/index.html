<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
        }

        div.items {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        div :nth-child(1) {
            align-self: auto;
        }

        div#i2 {
            align-self: flex-start;
        }

        div#i3 {
            align-self: flex-end;
        }

        div#i4 {
          align-self: center;  
        }

        div#i5 {
            align-self: stretch;
        }


    </style>
</head>
<body>
    <p>
        alinhamento de items dentro de um container utlizando o ALIGN-SELF, pode ser utilizado class, id ou nth-child para selecionar a div e definir seu alinhamento</p>
    <div class="container">
        <div class="items" id="i1">1 <br> auto</div>
        <div class="items" id="i2">2 <br> flex-start</div>
        <div class="items" id="i3">3 <br> flex-end</div>
        <div class="items" id="i4">4 <br> center</div>
        <div class="items" id="i5">5 <br> stretch</div>
        <div class="items" id="i6">6 <br> nada</div>
        <div class="items" id="i7">7 <br> nada</div>
    </div>    
</body>
</html>
