<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        div.items {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div :nth-child(1) {
            order: 0;
        }

        div#i2 {
            order: -2;
        }

        div#i3 {
            order: 4;
        }

        div#i4 {
            order: 8;
        }

        div#i5 {
            order: 2;
        }

        div#i6 {
            order: 0;
        }
        
        div#i7 {
            order: -4;
        }

    </style>
</head>
<body>
    <p>ordenação de items dentro de um container utlizando o ORDER, pode ser utilizado class, id ou nth-child para selecionar a div e definir sua ordem</p>
    <div class="container">
        <div class="items" id="i1">1</div>
        <div class="items" id="i2">2</div>
        <div class="items" id="i3">3</div>
        <div class="items" id="i4">4</div>
        <div class="items" id="i5">5</div>
        <div class="items" id="i6">6</div>
        <div class="items" id="i7">7</div>
    </div>    
</body>
</html>
